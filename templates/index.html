<!DOCTYPE html>
<html>

<head>

    <title>Nova AI</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            NOVA AI
        </div>

        <div class="tagline">
            Your Intelligent AI Assistant 🚀
        </div>

        <div class="sidebar-box">
            👋 Welcome Lipika
        </div>

        <div class="sidebar-box">
            🤖 AI Powered Chatbot
        </div>

        <div class="sidebar-box">
            ⚡ Fast Responses
        </div>

    </div>

    <!-- CHAT SECTION -->

    <div class="chat-section">

        <div class="topbar">
            Nova AI Assistant
        </div>

        <div id="chat-box"></div>

        <div class="input-area">

            <input type="text"
            id="user-input"
            placeholder="Ask anything...">

            <button onclick="startListening()" id="mic-btn">
                🎤
            </button>

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
